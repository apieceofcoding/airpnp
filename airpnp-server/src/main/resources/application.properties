spring.application.name=airpnp-server

spring.datasource.url=jdbc:h2:mem:airpnp
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# 로컬 H2 실습: JPA가 테이블을 만든 뒤 숙소 9개를 자동으로 넣습니다.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=embedded
spring.sql.init.data-locations=classpath:sql/stays.sql

spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=debug

airpnp.web-origin=http://localhost:5173
