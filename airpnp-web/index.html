<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>airpnp | 바다 앞 아파트, 한옥, 숲속 오두막</title>
	<link rel="icon" href="/images/logo.svg">
	<link rel="stylesheet" href="/src/style.css">
</head>
<body>
	<header class="site-header home-header">
		<div class="container header-row">
			<a class="logo" href="/">
				<img src="/images/logo.svg" alt="" width="32" height="32">
				<span>airpnp</span>
			</a>
			<nav class="tabs" aria-label="카테고리">
				<a class="tab" href="/" aria-current="page">
					<svg class="tab-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4 4 14v14h9v-8h6v8h9V14z" fill="#ffb5a8"/><path d="M16 4 28 14v4L16 8 4 18v-4z" fill="#e8553d"/></svg>
					숙소
				</a>
				<a class="tab" href="/">
					<svg class="tab-icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="12" r="7" fill="#ffd36b"/><path d="M6 28q10-14 20 0z" fill="#7dbb6a"/></svg>
					체험
				</a>
				<a class="tab" href="/">
					<svg class="tab-icon" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="9" width="20" height="16" rx="3" fill="#9cc7ef"/><path d="M12 9V6h8v3" stroke="#4a7fb3" stroke-width="2" fill="none"/></svg>
					서비스
				</a>
			</nav>
			<div class="header-actions">
				<a class="host-link" href="/">호스트 되기</a>
				<button class="round-button" type="button" aria-label="언어와 통화">
					<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
				</button>
				<button class="round-button" type="button" aria-label="메뉴">
					<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
				</button>
			</div>
		</div>

		<form class="search-bar" role="search" onsubmit="return false">
			<label class="search-field">
				<span class="search-label">여행지</span>
				<input type="text" placeholder="여행지 검색">
			</label>
			<span class="search-divider"></span>
			<label class="search-field">
				<span class="search-label">날짜</span>
				<input type="text" placeholder="날짜 추가">
			</label>
			<span class="search-divider"></span>
			<label class="search-field">
				<span class="search-label">여행자</span>
				<input type="text" placeholder="게스트 추가">
			</label>
			<button class="search-button" type="submit" aria-label="검색">
				<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
			</button>
		</form>
	</header>

	<main class="container home" id="sections"></main>

	<template id="section-template">
		<section class="stay-row">
			<div class="row-head">
				<h2><a class="row-title" href="/"></a></h2>
				<div class="row-arrows">
					<button class="arrow" type="button" data-dir="-1" aria-label="이전">
						<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
					</button>
					<button class="arrow" type="button" data-dir="1" aria-label="다음">
						<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
					</button>
				</div>
			</div>
			<div class="row-track"></div>
		</section>
	</template>

	<template id="card-template">
		<a class="stay-card">
			<div class="card-photo">
				<img alt="" loading="lazy">
				<span class="favorite-badge" hidden>게스트 선호</span>
				<span class="heart" aria-hidden="true">
					<svg viewBox="0 0 32 32"><path d="M16 28c7-4.7 14-10 14-17a7 7 0 0 0-14-2.6A7 7 0 0 0 2 11c0 7 7 12.3 14 17z"/></svg>
				</span>
			</div>
			<p class="card-title"></p>
			<p class="card-dates"></p>
			<p class="card-price"><span class="total"></span><span class="rating"></span></p>
		</a>
	</template>

	<footer class="site-footer">
		<div class="container">
			<p>© 2026 airpnp. 실습용 예제 서비스입니다. 화면에 보이는 숙소, 호스트와 게스트는 실제가 아니에요.</p>
		</div>
	</footer>

	<script type="module" src="/src/app.js"></script>
</body>
</html>
