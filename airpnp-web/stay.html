<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>airpnp</title>
	<link rel="icon" href="/images/logo.svg">
	<link rel="stylesheet" href="/src/style.css">
</head>
<body>
	<header class="site-header">
		<div class="container narrow header-row">
			<a class="logo" href="/">
				<img src="/images/logo.svg" alt="" width="32" height="32">
				<span>airpnp</span>
			</a>
			<a class="mini-search" href="/">
				<span>어디든지</span>
				<span>언제든 일주일</span>
				<span class="muted">게스트 추가</span>
				<span class="mini-search-button">
					<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
				</span>
			</a>
			<div class="header-actions">
				<a class="host-link" href="/">호스트 되기</a>
				<button class="round-button" type="button" aria-label="메뉴">
					<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
				</button>
			</div>
		</div>
	</header>

	<main id="detail" class="container narrow detail" hidden>
		<div class="title-row">
			<h1 id="title"></h1>
			<div class="title-actions">
				<button type="button" class="text-button">
					<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
					<span>공유하기</span>
				</button>
				<button type="button" class="text-button">
					<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20c5-3.4 9-7.2 9-12a5 5 0 0 0-9-2.9A5 5 0 0 0 3 8c0 4.8 4 8.6 9 12z"/></svg>
					<span>저장</span>
				</button>
			</div>
		</div>

		<div class="gallery">
			<img id="cover" class="gallery-main" alt="">
			<img src="/images/rooms/living.svg" alt="">
			<img src="/images/rooms/bedroom.svg" alt="">
			<img src="/images/rooms/kitchen.svg" alt="">
			<img src="/images/rooms/bathroom.svg" alt="">
			<button type="button" class="all-photos">
				<svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="3" r="1.5"/><circle cx="8" cy="3" r="1.5"/><circle cx="13" cy="3" r="1.5"/><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/><circle cx="3" cy="13" r="1.5"/><circle cx="8" cy="13" r="1.5"/><circle cx="13" cy="13" r="1.5"/></g></svg>
				사진 모두 보기
			</button>
		</div>

		<div class="detail-layout">
			<article class="detail-main">
				<section class="overview">
					<h2 id="headline"></h2>
					<p id="rooms" class="rooms"></p>
				</section>

				<section id="favorite-box" class="favorite-box">
					<div class="laurel">
						<svg viewBox="0 0 20 32" aria-hidden="true"><path d="M15 30C6 26 3 18 5 6M5 10c-3 0-4-3-4-5 3 0 4 2 4 5zM5 16c-3 0-5-2-5-4 3-1 5 1 5 4zM6 22c-3 1-5-1-6-3 3-1 5 0 6 3z" fill="#222"/></svg>
						<strong>게스트<br>선호</strong>
						<svg viewBox="0 0 20 32" aria-hidden="true" class="flip"><path d="M15 30C6 26 3 18 5 6M5 10c-3 0-4-3-4-5 3 0 4 2 4 5zM5 16c-3 0-5-2-5-4 3-1 5 1 5 4zM6 22c-3 1-5-1-6-3 3-1 5 0 6 3z" fill="#222"/></svg>
					</div>
					<p class="favorite-text">게스트에게 가장 사랑받는 숙소</p>
					<div class="score"><strong id="rating"></strong><span class="stars">★★★★★</span></div>
					<div class="score"><strong id="review-count"></strong><span>후기</span></div>
				</section>

				<section class="host-row">
					<span id="host-avatar" class="avatar"></span>
					<div>
						<p class="host-name">호스트: <span id="host-name"></span>님</p>
						<p id="host-years" class="muted"></p>
					</div>
				</section>

				<section class="highlights">
					<div>
						<svg class="icon large" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="15" cy="12" r="1"/></svg>
						<div><strong>셀프 체크인</strong><p class="muted">키패드를 이용해 체크인하세요.</p></div>
					</div>
					<div>
						<svg class="icon large" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l2 5H6zM6 8h12v13H6zM10 12h4"/></svg>
						<div><strong>무료 취소</strong><p class="muted">체크인 3일 전까지 전액 환불돼요.</p></div>
					</div>
				</section>

				<section>
					<p id="description" class="description"></p>
				</section>

				<section>
					<h2>숙소 편의시설</h2>
					<ul id="amenities" class="amenities"></ul>
				</section>

				<section>
					<h2 id="calendar-title" class="calendar-title"></h2>
					<p id="calendar-range" class="muted"></p>
					<div id="calendar" class="calendar"></div>
				</section>
			</article>

			<aside class="booking-card">
				<p class="price-line"><strong id="price-total"></strong> <span id="price-nights" class="muted"></span></p>
				<form id="booking-form">
					<div class="booking-box">
						<div class="box-cell">
							<span class="box-label">체크인</span>
							<span id="check-in-text"></span>
						</div>
						<div class="box-cell">
							<span class="box-label">체크아웃</span>
							<span id="check-out-text"></span>
						</div>
						<label class="box-cell wide">
							<span class="box-label">인원</span>
							<select id="guests"></select>
						</label>
						<label class="box-cell wide">
							<span class="box-label">예약자 이름</span>
							<input id="guest-name" type="text" placeholder="이름을 적어 주세요" required>
						</label>
					</div>
					<button id="book-button" type="submit" class="book-button">예약하기</button>
				</form>
				<p class="muted center">예약 확정 전에는 요금이 청구되지 않습니다.</p>
				<dl id="breakdown" class="breakdown">
					<div><dt id="breakdown-label"></dt><dd id="breakdown-amount"></dd></div>
					<div class="sum"><dt>총액</dt><dd id="breakdown-total"></dd></div>
				</dl>
				<p id="status" class="status" role="status"></p>
			</aside>
		</div>
	</main>

	<main id="load-error" class="container narrow load-error" hidden>
		<h1>숙소를 찾을 수 없어요</h1>
		<p></p>
		<a href="/">홈으로 돌아가기</a>
	</main>

	<footer class="site-footer">
		<div class="container narrow">
			<p>© 2026 airpnp. 실습용 예제 서비스입니다. 화면에 보이는 숙소, 호스트와 게스트는 실제가 아니에요.</p>
		</div>
	</footer>

	<script type="module" src="/src/stay.ts"></script>
</body>
</html>
