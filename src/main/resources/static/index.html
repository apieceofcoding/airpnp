<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>조각모임: 취향 한 조각을 나누는 모임</title>
	<link rel="icon" href="/images/logo.svg">
	<link rel="stylesheet" href="/style.css">
</head>
<body>
	<svg hidden>
		<symbol id="icon-calendar" viewBox="0 0 24 24">
			<rect x="3.5" y="5" width="17" height="15.5" rx="3"/>
			<path d="M3.5 10h17M8 3v4M16 3v4"/>
		</symbol>
		<symbol id="icon-pin" viewBox="0 0 24 24">
			<path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/>
			<circle cx="12" cy="9.5" r="2.5"/>
		</symbol>
		<symbol id="icon-people" viewBox="0 0 24 24">
			<circle cx="9" cy="8" r="3.5"/>
			<path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.3c2.1.7 3.5 2.7 3.5 5.7"/>
		</symbol>
	</svg>

	<header class="site-header">
		<div class="container">
			<a class="logo" href="/">
				<img src="/images/logo.svg" alt="" width="28" height="28">
				<span>조각모임</span>
			</a>
			<span class="region">서울</span>
		</div>
	</header>

	<main class="container">
		<section class="hero">
			<h1>이번 주, 어디서 모일까요?</h1>
			<p id="summary"></p>
		</section>

		<nav id="category-chips" class="chips" aria-label="모임 분류"></nav>

		<section id="meetup-grid" class="meetup-grid"></section>
	</main>

	<footer class="site-footer">
		<div class="container">
			<strong>조각모임</strong>
			<p>실습용 예제 서비스입니다. 화면에 보이는 모임과 이름은 실제가 아니에요.</p>
		</div>
	</footer>

	<template id="card-template">
		<a class="card">
			<div class="cover">
				<img alt="">
				<span class="badge" hidden></span>
			</div>
			<p class="meta"><span class="district"></span><span class="category"></span></p>
			<h2 class="title"></h2>
			<p class="row"><svg class="icon" aria-hidden="true"><use href="#icon-calendar"></use></svg><span class="when"></span></p>
			<p class="row"><svg class="icon" aria-hidden="true"><use href="#icon-pin"></use></svg><span class="where"></span></p>
			<p class="row"><svg class="icon" aria-hidden="true"><use href="#icon-people"></use></svg><span class="people"></span></p>
		</a>
	</template>

	<script src="/common.js"></script>
	<script src="/app.js"></script>
</body>
</html>
