<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>조각모임</title>
	<link rel="icon" href="/images/logo.svg">
	<link rel="stylesheet" href="/style.css">
</head>
<body class="detail-page">
	<svg hidden>
		<symbol id="icon-calendar" viewBox="0 0 24 24">
			<rect x="3.5" y="5" width="17" height="15.5" rx="3"/>
			<path d="M3.5 10h17M8 3v4M16 3v4"/>
		</symbol>
		<symbol id="icon-pin" viewBox="0 0 24 24">
			<path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/>
			<circle cx="12" cy="9.5" r="2.5"/>
		</symbol>
		<symbol id="icon-people" viewBox="0 0 24 24">
			<circle cx="9" cy="8" r="3.5"/>
			<path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.3c2.1.7 3.5 2.7 3.5 5.7"/>
		</symbol>
		<symbol id="icon-back" viewBox="0 0 24 24">
			<path d="M15 5l-7 7 7 7"/>
		</symbol>
	</svg>

	<header class="site-header">
		<div class="container">
			<a class="logo" href="/">
				<img src="/images/logo.svg" alt="" width="28" height="28">
				<span>조각모임</span>
			</a>
			<span class="region">서울</span>
		</div>
	</header>

	<main id="detail" class="container detail" hidden>
		<a class="back" href="/"><svg class="icon" aria-hidden="true"><use href="#icon-back"></use></svg>모임 목록</a>

		<div class="detail-layout">
			<article class="detail-main">
				<div class="cover"><img id="cover" alt=""></div>
				<p class="meta"><span id="district"></span><span id="category"></span></p>
				<h1 id="title"></h1>
				<p class="host"><span id="host-avatar"></span><span><strong id="host-name"></strong> 님이 여는 모임</span></p>

				<ul class="info">
					<li><svg class="icon" aria-hidden="true"><use href="#icon-calendar"></use></svg><span id="when"></span></li>
					<li><svg class="icon" aria-hidden="true"><use href="#icon-pin"></use></svg><span id="where"></span></li>
					<li><svg class="icon" aria-hidden="true"><use href="#icon-people"></use></svg><span id="people"></span></li>
				</ul>

				<section>
					<h2>모임 소개</h2>
					<p id="description" class="description"></p>
				</section>

				<section>
					<h2>함께하는 멤버 <span id="member-count" class="count"></span></h2>
					<p id="no-members" class="empty" hidden>아직 신청한 멤버가 없어요. 첫 번째 멤버가 되어 보세요.</p>
					<ul id="members" class="members"></ul>
				</section>
			</article>

			<aside class="signup">
				<p id="signup-when" class="signup-when"></p>
				<p id="signup-seats" class="signup-seats"></p>
				<div class="progress"><div id="progress-bar"></div></div>
				<form id="signup-form">
					<input id="name" type="text" name="name" placeholder="이름을 적어 주세요" aria-label="이름" required>
					<button id="signup-button" type="submit">신청하기</button>
				</form>
				<p id="status" class="status" role="status"></p>
			</aside>
		</div>
	</main>

	<main id="load-error" class="container load-error" hidden>
		<p></p>
		<a href="/">모임 목록으로 돌아가기</a>
	</main>

	<footer class="site-footer">
		<div class="container">
			<strong>조각모임</strong>
			<p>실습용 예제 서비스입니다. 화면에 보이는 모임과 이름은 실제가 아니에요.</p>
		</div>
	</footer>

	<script src="/common.js"></script>
	<script src="/meetup.js"></script>
</body>
</html>
